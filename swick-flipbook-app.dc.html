<!DOCTYPE html>
<!Concept: JGL (JMJ & Kids) | Je 29:11 & Hb 2:2>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swick Flipbook">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-32.png">
  <title>Swick Flipbook — Denise Swick &amp; Downsize Allies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#0b0b0d;height:100%;overscroll-behavior:none;}
    a{color:#e3bd6f;}
    a:hover{color:#f0cf8e;}
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</helmet>
<div style="position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:#0b0b0d;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);font-family:'Poppins',sans-serif;">
  <dc-import name="FlipbookApp" hint-size="100%,100%" style="display:block;width:100%;height:100%;"></dc-import>

  <sc-if value="{{ showInstall }}" hint-placeholder-val="{{ true }}">
    <div style="position:fixed;inset:0;z-index:900;background:rgba(6,6,7,0.92);display:flex;align-items:center;justify-content:center;padding:26px;">
      <div style="width:100%;max-width:340px;background:#121115;border:1px solid rgba(201,162,74,0.35);border-radius:22px;padding:32px 26px 28px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,0.6);">

        <sc-if value="{{ isChoiceMode }}" hint-placeholder-val="{{ true }}">
          <img src="icons/icon-192.png" alt="" style="width:76px;height:76px;border-radius:18px;margin:0 auto 16px;display:block;" />
          <h2 style="font-family:'Playfair Display',serif;font-weight:700;font-size:25px;color:#f7f1e3;margin:0;">Get the App</h2>
          <p style="font-size:16px;color:rgba(244,236,216,0.7);margin:12px 0 22px;line-height:1.65;">Add Swick Flipbook to your Home Screen for quick, one-tap access — just like a real app.</p>

          <div style="display:flex;gap:8px;background:rgba(255,255,255,0.05);border-radius:14px;padding:5px;margin-bottom:22px;">
            <button data-interactive="true" onClick="{{ chooseIphone }}" style="{{ iphoneTabStyle }}">iPhone</button>
            <button data-interactive="true" onClick="{{ chooseAndroid }}" style="{{ androidTabStyle }}">Android</button>
          </div>

          <button data-interactive="true" onClick="{{ primaryAction }}" style="width:100%;height:66px;border-radius:16px;background:linear-gradient(145deg,#e3bd6f,#a8792f);border:none;color:#1a1408;font-size:20px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;">Add to Home Screen</button>

          <button data-interactive="true" onClick="{{ dismiss }}" style="margin-top:18px;background:none;border:none;color:rgba(244,236,216,0.45);font-size:15px;font-family:'Poppins',sans-serif;cursor:pointer;text-decoration:underline;">Maybe later</button>
        </sc-if>

        <sc-if value="{{ isStepMode }}" hint-placeholder-val="{{ false }}">
          <h2 style="font-family:'Playfair Display',serif;font-weight:700;font-size:23px;color:#f7f1e3;margin:0 0 20px;">{{ stepsTitle }}</h2>
          <div style="display:flex;flex-direction:column;gap:16px;text-align:left;">
            <sc-for list="{{ steps }}" as="st" hint-placeholder-count="3">
              <div style="display:flex;gap:14px;align-items:flex-start;">
                <div style="width:36px;height:36px;border-radius:50%;background:rgba(201,162,74,0.16);border:1px solid rgba(201,162,74,0.5);color:#e3bd6f;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">{{ st.n }}</div>
                <div style="font-size:16px;color:rgba(244,236,216,0.9);line-height:1.55;padding-top:6px;">{{ st.text }}</div>
              </div>
            </sc-for>
          </div>
          <button data-interactive="true" onClick="{{ dismiss }}" style="width:100%;height:62px;border-radius:16px;background:linear-gradient(145deg,#e3bd6f,#a8792f);border:none;color:#1a1408;font-size:18px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;margin-top:24px;">Got it — take me to the book</button>
          <button data-interactive="true" onClick="{{ backToChoice }}" style="margin-top:14px;background:none;border:none;color:rgba(244,236,216,0.45);font-size:14px;font-family:'Poppins',sans-serif;cursor:pointer;text-decoration:underline;">Back</button>
        </sc-if>

      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    showInstall: (typeof localStorage === 'undefined' || localStorage.getItem('swickInstallDismissed') !== '1'),
    platform: (/iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream) ? 'ios' : 'android',
    stepMode: null,
  };

  _deferredPrompt = null;

  componentDidMount() {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      this._deferredPrompt = e;
      this.forceUpdate();
    });
    window.addEventListener('appinstalled', () => {
      try { localStorage.setItem('swickInstallDismissed', '1'); } catch (err) {}
      this.setState({ showInstall: false });
    });
  }

  chooseIphone = () => this.setState({ platform: 'ios', stepMode: null });
  chooseAndroid = () => this.setState({ platform: 'android', stepMode: null });
  backToChoice = () => this.setState({ stepMode: null });

  dismiss = () => {
    try { localStorage.setItem('swickInstallDismissed', '1'); } catch (err) {}
    this.setState({ showInstall: false });
  };

  primaryAction = () => {
    if (this.state.platform === 'android' && this._deferredPrompt) {
      this._deferredPrompt.prompt();
      this._deferredPrompt.userChoice.then((choice) => {
        if (choice.outcome === 'accepted') {
          try { localStorage.setItem('swickInstallDismissed', '1'); } catch (err) {}
          this.setState({ showInstall: false });
        }
        this._deferredPrompt = null;
      });
      return;
    }
    this.setState({ stepMode: this.state.platform === 'ios' ? 'ios-steps' : 'android-fallback' });
  };

  renderVals() {
    const { showInstall, platform, stepMode } = this.state;
    const tabBase = 'flex:1;padding:12px 0;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:\'Poppins\',sans-serif;';
    const active = 'background:#e3bd6f;color:#1a1408;';
    const inactive = 'background:transparent;color:rgba(244,236,216,0.6);';
    const stepsByMode = {
      'ios-steps': {
        title: 'On iPhone (Safari)',
        steps: [
          { n: 1, text: 'Tap the Share icon (square with an arrow) in the Safari toolbar.' },
          { n: 2, text: 'Scroll down and tap "Add to Home Screen".' },
          { n: 3, text: 'Tap "Add" in the top right corner.' },
        ],
      },
      'android-fallback': {
        title: 'On Android (Chrome)',
        steps: [
          { n: 1, text: 'Tap the menu icon (three dots) in the top right corner.' },
          { n: 2, text: 'Tap "Add to Home screen" or "Install app".' },
          { n: 3, text: 'Tap "Install" or "Add" to confirm.' },
        ],
      },
    };
    const active_steps = stepsByMode[stepMode] || { title: '', steps: [] };
    return {
      showInstall,
      isChoiceMode: !stepMode,
      isStepMode: !!stepMode,
      stepsTitle: active_steps.title,
      steps: active_steps.steps,
      iphoneTabStyle: tabBase + (platform === 'ios' ? active : inactive),
      androidTabStyle: tabBase + (platform === 'android' ? active : inactive),
      chooseIphone: this.chooseIphone,
      chooseAndroid: this.chooseAndroid,
      backToChoice: this.backToChoice,
      dismiss: this.dismiss,
      primaryAction: this.primaryAction,
    };
  }
}
</script>
</body>
</html>
